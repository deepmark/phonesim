[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "phonesim"
version = "0.1.0"
description = "Provider-free phone-call audio-degradation simulator with real telephony codecs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "DeepMark Inc." }]
keywords = ["audio", "telephony", "codec", "simulation", "dsp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering",
]

# CPU and CUDA both work; install the torch build for your CUDA version from
# https://pytorch.org if needed.
dependencies = [
    "numpy>=1.21",
    "torch>=2.0",
    "soundfile>=0.11",
]

[project.urls]
Homepage = "https://github.com/deepmark/phonesim"
Issues = "https://github.com/deepmark/phonesim/issues"

[project.optional-dependencies]
# pesq/pystoi: analyze_channel reports None for PESQ/STOI when they are absent.
# matplotlib: required by plot_channel and `analyze --plot`.
# pyyaml: required for YAML configs; JSON configs always work.
yaml = ["pyyaml>=5.4"]
plot = ["matplotlib>=3.4"]
metrics = ["pesq>=0.0.4", "pystoi>=0.3"]
test = ["pytest>=7.0", "pyyaml>=5.4", "pystoi>=0.3", "matplotlib>=3.4"]
full = ["pyyaml>=5.4", "matplotlib>=3.4", "pesq>=0.0.4", "pystoi>=0.3", "pytest>=7.0"]

[project.scripts]
phonesim = "phonesim.cli:main"

[tool.setuptools]
packages = ["phonesim", "phonesim.stages", "phonesim.profiles"]

[tool.pytest.ini_options]
testpaths = ["tests"]
